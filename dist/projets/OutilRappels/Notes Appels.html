	<style>
:root{
	--bg0: #1c2a40;
	--bg1: #0a0f1f;
	--panel: #1c2a40;
	--btn: #2b4065;
	--btnHover: #35507f;
	--warn: #ce3232;
	--warnHover: #d44c4c;
	--font: white;
}
span{font-size: 20px;background-color: transparent!important;}
*{color: var(--font);}
body{
	position: absolute;
	display: flex;
	flex-direction: column;
	top: 0px;
	bottom: 0px;
	right: 0px;
	left: 0px;
	margin: 0px;
	/*height: 100%;/**/
	background: var(--bg0);
	min-width: 470px;
	overflow-x: auto;
}
h3, h2{
	user-select: none;
	margin: 5px;
}
.section{
	position: relative;
	display: flex;
	flex-direction: column;
	align-items: center;
	padding: 5px;
	margin: 0px;
	min-height: 85%;
	border-radius: 20px;
	background: var(--bg1);
	overflow-y: auto;
}
.vignette{
	position: relative;
	display: flex;
	flex-direction: column;
	background: var(--panel);
	padding: 5px;
	margin: 3px 0px;
	border-radius: 10px;
	width: 470px;
	>div{
		display: flex;
		flex-direction: row;
		justify-content: space-between;
		padding: 5px 0px;
	}
}
header{
	position: relative;
	display: flex;
	flex-direction: column;
	padding: 5px;
	>#listeBtn{
		display: flex;
		flex-direction: row;
		flex-wrap: wrap;
		justify-content: center;
		align-content: center;
	}
}
footer{
	position: relative;
	display: flex;
	flex-direction: row-reverse;
	padding: 5px;
	bottom: 0px;
	left: 0px;right: 0px;
}
input[type=text]{cursor: text;}
input, select, button, .btn, textarea{
	user-select: none;
	outline: none;
	text-decoration: none;
	display: flex;
	align-items: center;
	cursor: pointer;
	background: var(--btn);
	outline: 2px solid (--btn);
	padding: 10px;
	margin: 2px;
	border-radius: 10px;
	border: none;
	transition: all 0.5s;
}
input:hover, select:hover, button:hover, .btn:hover, textarea:hover{
	background: var(--btnHover);
	transition: all 0.5s;
}
input:focus, select:focus, button:focus, .btn:focus, textarea:focus{
	outline: 2px solid #4A90E2;
}
input:disabled, .btn:disabled{
	background: none;
	cursor: default;
}
input[type=time]{
	width: 68px;
}
textarea{
	resize: none;
	cursor: text;
}

}
#dataOT{

.warning{

.warning:hover{

/*-----------------------------tooltip---------------------------------*/
#tooltip{
	z-index: 1000;
	position: absolute;
	text-wrap: balance;
	max-width: 200px;
	border-radius: 5px;
	background: rgba(30, 30, 30, 0.5); /* semi-transparent */

}
/*-----------------------------END tooltip---------------------------------*/

	transition: all 1s;

/*-----------------------------TOGGLE------------------------------------*/
.switch {
  position: relative;
  display: inline-block;
  width: 60px;
  height: 34px;
}

/* Masquer le checkbox natif */
.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

/* Le slider (le design du switch) */
.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color:  var(--bg0)!important;
  transition: .4s;
  border-radius: 34px;
}

/* Le cercle intérieur */
.slider::before {
  position: absolute;
  content: "";
  height: 26px;
  width: 26px;
  left: 4px;
  bottom: 4px;
  background-color:  var(--btnHover)!important;
  transition: .4s;
  border-radius: 50%;
}

/* Quand c’est activé (checked) */
input:checked + .slider {
  background-color: #4CAF50!important;
}

input:checked + .slider::before {
  transform: translateX(26px);
}

Date.prototype.toDateTime = function(){
	const yyyy = this.getFullYear();
	const mm = String(this.getMonth() + 1).padStart(2, '0');
	const dd = String(this.getDate()).padStart(2, '0');
	const hh = String(this.getHours()).padStart(2, '0');
	const min = String(this.getMinutes()).padStart(2, '0');
	return `${yyyy}-${mm}-${dd}T${hh}:${min}`;
}
Date.prototype.toText = function(){
	const yyyy = this.getFullYear();
	const mm = String(this.getMonth() + 1).padStart(2, '0');
	const dd = String(this.getDate()).padStart(2, '0');
	const hh = String(this.getHours()).padStart(2, '0');
	const min = String(this.getMinutes()).padStart(2, '0');
	const sec = String(this.getSeconds()).padStart(2, '0');
	return `${dd}/${mm}/${yyyy} ${hh}:${min}:${sec}`;
}
Date.prototype.getHoursAndMin = function(){
	let hour = this.getHours()
	let min = this.getMinutes()
	if(hour < 10){
		hour = "0"+hour
	}
	if(min < 10){
		min = "0"+min
	}
	return hour+":"+min
}
Date.prototype.addMin = function(nbr){
	return new Date(this.getTime()+(nbr*60*1000))
}
Date.prototype.addHour = function(nbr){
	return new Date(this.getTime()+(nbr*60*60*1000))
}

let loopInstantly = false
let loopTimer = null;
let lastRappel = 0;
window.addEventListener('focus', function (e) {//on focus
    loopInstantly = true;
    // Forcer mise à jour immédiate
    if (loopTimer) clearTimeout(loopTimer);
    LoopUpdate();
});
window.addEventListener('blur', function (e) {//on blur
	loopInstantly = false
    // Forcer mise à jour immédiate
    if (loopTimer) clearTimeout(loopTimer);
    LoopUpdate();
});

async function LoopUpdate() {
    const now = Date.now();
    // Mise à jour de l'horloge
    document.getElementById("horloge").innerHTML = new Date().toText();
    // Exécution des rappels toutes les 10s
    if (now - lastRappel >= 10*1000) {
        setTimeout(() => { 
            RappelsCascade(); 
            CheckSended(); 
        }, 0); // non bloquant
        lastRappel = now;
    }
    // Prochaine exécution
    const delay = loopInstantly ? 0.5*1000 : 10*1000;
    // Ajuster le prochain timer pour que la boucle reste régulière
    loopTimer = setTimeout(LoopUpdate, delay);
}
function newWindow(adress, width, height) {
	var newWindow = window.open(adress, "_blank", "width=" + width+", height=" + height);
}
function clipBoard(text) {
	const textarea = document.createElement("textarea");
	textarea.value = text;
	textarea.setAttribute("readonly", "");
	textarea.style.position = "absolute";
	textarea.style.left = "-9999px";
	document.body.appendChild(textarea);
	textarea.select();
	document.execCommand("copy");
	document.body.removeChild(textarea);
}
function clipBoardDecodeURI(text){
	clipBoard(decodeURIComponent(text))
}
//-------------------------------------------------------------- TOOLTIP
function UpdateTooltip(vector, text) {
	const offset = 10;
	const tooltip = document.getElementById("tooltip"); // Assure-toi que cet ID est correct
	// Met à jour le texte et affiche
	tooltip.innerHTML = text;
	tooltip.style.display = "flex";
	tooltip.style.padding = "10px";
	tooltip.style.position = "absolute"; // Nécessaire si ce n'est pas déjà mis
	// D'abord, positionne à l'endroit "idéal"
	tooltip.style.top = vector.y + offset + "px";
	tooltip.style.left = vector.x + offset + "px";
	// Attend que le DOM ait pris en compte la taille
	requestAnimationFrame(() => {
		const rect = tooltip.getBoundingClientRect();
		const maxRight = window.innerWidth;
		const maxBottom = window.innerHeight;
		let top = vector.y + offset;
		let left = vector.x + offset;
		// Corrige le dépassement à droite
		if (rect.right > maxRight - 10) {
			left = vector.x - rect.width - offset;
		}
		// Corrige le dépassement en bas
		if (rect.bottom > maxBottom - 10) {
			top = vector.y - rect.height - offset;
		}
		// Applique les corrections finales
		tooltip.style.top = `${Math.max(top, 0)}px`;
		tooltip.style.left = `${Math.max(left, 0)}px`;
	});
}

	tooltip.style.padding = "0px";
	tooltip.innerHTML = ""
	tooltip.style.diplay = "none"

function SendNotification(title, body, tagId){
	if(Notification.permission === "granted"){
		const emoji = "✎";
		const canvas = document.createElement("canvas");
		canvas.width = 64;
		canvas.height = 64;
		const ctx = canvas.getContext("2d");
		ctx.font = "70px Arial";
		ctx.fillStyle = "#059100";
		ctx.fillText(emoji, 0, 60);
		const iconDataUrl = canvas.toDataURL();

		new Notification(title, {body: body, icon: iconDataUrl, tag:"rappel-"+tagId});
		//sur chrome cela demande l'autorisation a chaque fois a moins que j'ai mal fait un truc
	} else if (Notification.permission !== "denied") {
		Notification.requestPermission().then(permission => {
			if (permission === "granted") {
				showNotification(title, body);
			}
		});
	}
}
function playNotificationSound() {//plus aigu
	const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

	const playNote = (freq, delay = 0) => {
		const osc = audioCtx.createOscillator();
		const gain = audioCtx.createGain();

		osc.type = "sine"; // Onde claire, non agressive
		osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);

		// Fade rapide (son bref et clean)
		gain.gain.setValueAtTime(0.0001, audioCtx.currentTime + delay);
		gain.gain.exponentialRampToValueAtTime(0.4, audioCtx.currentTime + delay + 0.02);
		gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.25);

		osc.connect(gain);
		gain.connect(audioCtx.destination);

		osc.start(audioCtx.currentTime + delay);
		osc.stop(audioCtx.currentTime + delay + 0.3);
	};

	// Son double, rapide et clair
	playNote(880);      // La5
	playNote(1175, 0.15); // Ré#6 (plus aigu, 150ms après)
}

function TimeDifference(time1, time2){
	var diff = time2 - time1;
	function getTime(millisecondsToTime){
		var hh = Math.floor(millisecondsToTime / 1000 / 60 / 60);
		millisecondsToTime -= hh * 1000 * 60 * 60;
		var mm = Math.floor(millisecondsToTime / 1000 / 60);
		millisecondsToTime -= mm * 1000 * 60;
		var ss = Math.floor(millisecondsToTime / 1000);
		millisecondsToTime -= ss * 1000;
		
		return {hh,mm,ss};
	}
	return getTime(diff);
}
